# ==============================================================================
# Workflow Name: Release Render Proxy Container
# Purpose: Automatically builds and pushes the multi-architecture Docker image
#          ('ikaushikpal/dnsfilt-render-proxy:latest') for linux/amd64 and
#          linux/arm64 whenever changes inside 'dnsfilt-render-proxy/' are pushed to main.
# ==============================================================================
name: Release Render Proxy Container

on:
  push:
    branches:
      - main
    paths:
      - 'dnsfilt-render-proxy/**'
      - '.github/workflows/release-render-proxy.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-render-proxy
  cancel-in-progress: true

jobs:
  build-and-push-proxy:
    name: Build & Push Multi-Arch Proxy Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest main semver release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force || true
          RAW_TAG=$(git tag --list --sort=-version:refname | grep -E '^[a-zA-Z_-]*v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -n "$RAW_TAG" ]; then
            CLEAN_VER=$(echo "$RAW_TAG" | sed -E 's/^[a-zA-Z_-]*v?//')
          else
            CLEAN_VER="0.0.1"
          fi
          CLEAN_VER=${CLEAN_VER:-0.0.1}
          echo "tag=$CLEAN_VER" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $CLEAN_VER (from tag: ${RAW_TAG:-none})"

      - name: Set up QEMU (ARM64 Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: dnsfilt-render-proxy
          file: dnsfilt-render-proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ikaushikpal/dnsfilt-render-proxy:latest
            ikaushikpal/dnsfilt-render-proxy:${{ steps.release_tag.outputs.tag }}
            ikaushikpal/dnsfilt-render-proxy:v${{ steps.release_tag.outputs.tag }}
          cache-from: type=gha,scope=dnsfilt-render-proxy
          cache-to: type=gha,mode=max,scope=dnsfilt-render-proxy
