# ==============================================================================
# Workflow Name: PR Quality Gate
# Purpose: Automatically runs formatting, linting, type checks, build, unit tests,
#          and conventional commit title validation whenever a Pull Request
#          targeting the 'main' branch is opened or synchronized.
# ==============================================================================
name: PR Quality Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 1. Validate Conventional Commit PR Title
  validate-title:
    name: Validate Conventional Commit PR Title
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Frontend (dnsfilt-ui) Formatting, Type Checking & Build
  frontend-quality:
    name: Frontend (dnsfilt-ui) Build & Typecheck
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dnsfilt-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dnsfilt-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build production frontend bundle
        run: npm run build

  # 3. Backend Microservices Quality Gate (Resolver, Analytics, Admin Backend)
  backend-quality:
    name: Java Microservices Compilation & Test Checks
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify dnsfilt-resolver Build
        working-directory: dnsfilt-resolver
        run: gradle build --no-daemon -x test

      - name: Verify dnsfilt-analytics Build
        working-directory: dnsfilt-analytics
        run: gradle build --no-daemon -x test

      - name: Verify dnsfilt-admin-backend Build
        working-directory: dnsfilt-admin-backend
        run: gradle build --no-daemon -x test
