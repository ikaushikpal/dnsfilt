# ==============================================================================
# Workflow Name: Python Quality Gate (Python 3.11)
# Purpose: Automatically verifies compilation and dependency imports under Python 3.11
#          runtime whenever files under 'dnsfilt-orchestrator/**' change.
# ==============================================================================
name: Python Quality Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'dnsfilt-orchestrator/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Validate Orchestrator (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'dnsfilt-orchestrator/requirements.txt'

      - name: Install dependencies
        working-directory: dnsfilt-orchestrator
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python 3.11 Byte-Compilation
        working-directory: dnsfilt-orchestrator
        run: |
          set -euo pipefail
          echo "Compiling Orchestrator Python 3.11 source files..."
          python3 -m compileall app/

      - name: Test Orchestrator Module Imports
        working-directory: dnsfilt-orchestrator
        run: |
          set -euo pipefail
          echo "Verifying FastAPI app and config importability..."
          python3 -c "import app.config; import app.models; import app.schemas; print('All Python 3.11 modules imported cleanly!')"
