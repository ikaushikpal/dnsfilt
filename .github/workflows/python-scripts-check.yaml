# ==============================================================================
# Workflow Name: Python Scripts Quality Gate
# Purpose: Automatically runs byte-compilation, CLI output verification, and import
#          checks under Python 3.9 runtime whenever files under 'scripts/**' change.
#          Runs on Pull Requests only — not on direct pushes to main.
# ==============================================================================
name: Python Scripts Quality Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Validate Python Scripts (Python 3.9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Verify Python Script Compilation
        shell: bash
        run: |
          set -euo pipefail
          echo "Compiling Python scripts for Python 3.9 compatibility..."
          python3 -m py_compile scripts/cert-manager/manage_cert.py
          python3 -m py_compile scripts/cert-manager/cert_manager/*.py
          python3 -m py_compile scripts/platform-deployer/deploy.py
          python3 -m py_compile scripts/platform-deployer/deployer/*.py

      - name: Test Cert-Manager CLI Output
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cert-manager/manage_cert.py list

      - name: Test Platform-Deployer Imports
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/platform-deployer python3 -c "from deployer.config import DeploymentConfig; from deployer.email_reporter import EmailReporter; print(DeploymentConfig())"
