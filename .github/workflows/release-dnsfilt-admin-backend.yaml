# ==============================================================================
# Workflow Name: Release dnsfilt-admin-backend Container
# ==============================================================================
name: Release dnsfilt-admin-backend Container

on:
  push:
    branches:
      - main
    paths:
      - 'dnsfilt-admin-backend/**'
      - 'dnsfilt-ui/**'
      - '.github/workflows/release-dnsfilt-admin-backend.yaml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-dnsfilt-admin-backend
  cancel-in-progress: false

jobs:
  version-and-tag:
    name: Compute Version And Create Tags
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute semantic version bump
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force || true
          RAW_TAG=$(git tag --list 'admin-v*' 'v*' --sort=-version:refname | grep -E '^[a-zA-Z_-]*v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -n "$RAW_TAG" ]; then
            CLEAN_VER=$(echo "$RAW_TAG" | sed -E 's/^[a-zA-Z_-]*v?//')
          else
            CLEAN_VER="0.0.0"
          fi
          CLEAN_VER=${CLEAN_VER:-0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VER"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed next release version: $VERSION (from previous tag: ${RAW_TAG:-none})"

      - name: Create git tag
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG_NAME="admin-v${VERSION}"
          if ! git ls-remote --tags origin | grep -q "refs/tags/${TAG_NAME}$"; then
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
          fi

  docker-build-and-push:
    name: Build & Push Admin Backend Image
    needs: version-and-tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js (For Admin Backend UI Build)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dnsfilt-ui/package-lock.json

      - name: Build Frontend Static Bundle
        working-directory: dnsfilt-ui
        run: |
          npm ci
          npm run build
          mkdir -p ../dnsfilt-admin-backend/src/main/resources/static
          cp -r dist/dnsfilt-ui/browser/* ../dnsfilt-admin-backend/src/main/resources/static/
          cp dist/dnsfilt-ui/browser/home/index.html ../dnsfilt-admin-backend/src/main/resources/static/index.html

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Image Repository
        id: image
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "repo=${{ secrets.DOCKERHUB_USERNAME }}/dnsfilt-admin-backend" >> "$GITHUB_OUTPUT"
          else
            echo "repo=ikaushikpal/dnsfilt-admin-backend" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: dnsfilt-admin-backend
          file: dnsfilt-admin-backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}:latest
            ${{ steps.image.outputs.repo }}:${{ needs.version-and-tag.outputs.version }}
            ${{ steps.image.outputs.repo }}:v${{ needs.version-and-tag.outputs.version }}
          cache-from: type=gha,scope=dnsfilt-admin-backend
          cache-to: type=gha,mode=max,scope=dnsfilt-admin-backend
