# ==============================================================================
# Workflow Name: CD Deploy to OCI ARM VM
# Purpose: Automatically connects to your Oracle Cloud Infrastructure (OCI) ARM VM
#          via SSH and runs deploy scripts with health verification & rollback.
# ==============================================================================
name: CD Deploy to OCI ARM VM

on:
  workflow_run:
    workflows: ["Release Docker On Main"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - dnsfilt-admin-backend
          - dnsfilt-analytics
          - dnsfilt-orchestrator
      tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'

jobs:
  deploy-to-oci:
    name: Deploy to OCI VM
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Repository Scripts
        uses: actions/checkout@v4

      # Step 1: Copy local deploy scripts to the OCI VM
      - name: Copy Deploy Scripts to OCI VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "scripts/"
          target: "~/dnsfilt_deploy/"

      # Step 2: Execute Deployment over SSH
      - name: Execute Deployment Scripts via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVICE_TARGET: ${{ github.event.inputs.service || 'all' }}
          IMAGE_TAG: ${{ github.event.inputs.tag || 'latest' }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME || 'ikaushikpal' }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: SERVICE_TARGET,IMAGE_TAG,DOCKER_USER
          script_stop: true
          script: |
            set -euo pipefail
            echo "========================================================"
            echo "🚀 Connected to OCI Host: $(uname -n) ($(uname -m))"
            echo "🎯 Target Service: ${SERVICE_TARGET}"
            echo "🏷️ Image Tag: ${IMAGE_TAG}"
            echo "👤 Docker User: ${DOCKER_USER}"
            echo "========================================================"

            # Make copied scripts executable
            chmod +x ~/dnsfilt_deploy/scripts/*.sh

            # Deploy Backend
            if [ "${SERVICE_TARGET}" = "all" ] || [ "${SERVICE_TARGET}" = "dnsfilt-admin-backend" ]; then
              echo "▶️ Running deploy-backend.sh..."
              bash ~/dnsfilt_deploy/scripts/deploy-backend.sh "${IMAGE_TAG}" "${DOCKER_USER}"
            fi

            # Deploy Analytics
            if [ "${SERVICE_TARGET}" = "all" ] || [ "${SERVICE_TARGET}" = "dnsfilt-analytics" ]; then
              echo "▶️ Running deploy-analytics.sh..."
              bash ~/dnsfilt_deploy/scripts/deploy-analytics.sh "${IMAGE_TAG}" "${DOCKER_USER}"
            fi

            # Deploy Orchestrator
            if [ "${SERVICE_TARGET}" = "all" ] || [ "${SERVICE_TARGET}" = "dnsfilt-orchestrator" ]; then
              echo "▶️ Running deploy-orchestrator.sh..."
              bash ~/dnsfilt_deploy/scripts/deploy-orchestrator.sh "${IMAGE_TAG}" "${DOCKER_USER}"
            fi

            echo "========================================================"
            echo "✅ Deployment completed successfully on OCI VM!"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" 2>/dev/null || sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "========================================================"
