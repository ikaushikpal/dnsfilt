# ==============================================================================
# Workflow Name: Release Docker On Main
# Purpose: Triggers upon pushes to the 'main' branch, computes ONE Semantic
#          Version tag, creates ONE Git tag, and builds & pushes production multi-arch
#          Docker images (linux/amd64, linux/arm64) to Docker Hub with layer caching.
# ==============================================================================
name: Release Docker On Main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version-and-tag:
    name: Compute Version And Create Single Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute semantic version bump
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force || true
          RAW_TAG=$(git tag --list --sort=-version:refname | grep -E '^[a-zA-Z_-]*v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -n "$RAW_TAG" ]; then
            CLEAN_VER=$(echo "$RAW_TAG" | sed -E 's/^[a-zA-Z_-]*v?//')
          else
            CLEAN_VER="0.0.0"
          fi
          CLEAN_VER=${CLEAN_VER:-0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VER"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed next release version: $VERSION (from previous tag: ${RAW_TAG:-none})"

      - name: Create single version tag
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG_NAME="v${VERSION}"
          if ! git ls-remote --tags origin | grep -q "refs/tags/${TAG_NAME}$"; then
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
          fi

  docker-build-and-push-matrix:
    name: Build & Push Multi-Arch Service Images
    needs: version-and-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: dnsfilt-resolver
            context: dnsfilt-resolver
            image: dnsfilt-resolver
          - service: dnsfilt-analytics
            context: dnsfilt-analytics
            image: dnsfilt-analytics
          - service: dnsfilt-admin-backend
            context: dnsfilt-admin-backend
            image: dnsfilt-admin-backend
            no_docker_cache: true  # Angular UI bundle must always be rebuilt fresh
          - service: dnsfilt-render-proxy
            context: dnsfilt-render-proxy
            image: dnsfilt-render-proxy
          - service: dnsfilt-orchestrator
            context: dnsfilt-orchestrator
            image: dnsfilt-orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (For Admin Backend UI Build)
        if: matrix.service == 'dnsfilt-admin-backend'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dnsfilt-ui/package-lock.json

      - name: Build Frontend Static Bundle
        if: matrix.service == 'dnsfilt-admin-backend'
        working-directory: dnsfilt-ui
        run: |
          npm ci
          npm run build
          mkdir -p ../dnsfilt-admin-backend/src/main/resources/static
          cp -r dist/dnsfilt-ui/browser/* ../dnsfilt-admin-backend/src/main/resources/static/
          cp -f dist/dnsfilt-ui/browser/index.csr.html ../dnsfilt-admin-backend/src/main/resources/static/index.html || cp -f dist/dnsfilt-ui/browser/home/index.html ../dnsfilt-admin-backend/src/main/resources/static/index.html

      - name: Set Up QEMU (ARM64 Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login To Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'ikaushikpal' }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'ikaushikpal' }}/${{ matrix.image }}:v${{ needs.version-and-tag.outputs.version }}
          # Skip Docker layer cache for services with embedded frontend bundles (e.g. admin-backend)
          # to guarantee the latest Angular build is always included in the image.
          cache-from: ${{ !matrix.no_docker_cache && format('type=gha,scope={0}', matrix.service) || '' }}
          cache-to: ${{ !matrix.no_docker_cache && format('type=gha,mode=max,scope={0}', matrix.service) || '' }}