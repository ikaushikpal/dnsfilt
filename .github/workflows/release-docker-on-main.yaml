# ==============================================================================
# Workflow Name: Release Docker On Main
# Purpose: Triggers upon pushes to the 'main' branch, computes the next Semantic
#          Version tag, creates Git tags, and builds & pushes production Docker images
#          to Docker Hub with GitHub layer caching.
# ==============================================================================
name: Release Docker On Main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version-and-tag:
    name: Compute Version And Create Tags
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute semantic version bump
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | sed 's/v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          PREV_TAG=${PREV_TAG:-0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$PREV_TAG"
          PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG_NAME="v${VERSION}"
          if ! git ls-remote --tags origin | grep -q "refs/tags/${TAG_NAME}$"; then
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
          fi
          git tag -f latest
          git push origin latest --force

  docker-build-and-push-matrix:
    name: Build & Push Service Images
    needs: version-and-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: dnsfilt-resolver
            context: dnsfilt-resolver
            image: dnsfilt-resolver
          - service: dnsfilt-analytics
            context: dnsfilt-analytics
            image: dnsfilt-analytics
          - service: dnsfilt-admin-backend
            context: dnsfilt-admin-backend
            image: dnsfilt-admin-backend
          - service: dnsfilt-render-proxy
            context: dnsfilt-render-proxy
            image: dnsfilt-render-proxy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (For Admin Backend UI Build)
        if: matrix.service == 'dnsfilt-admin-backend'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dnsfilt-ui/package-lock.json

      - name: Build Frontend Static Bundle
        if: matrix.service == 'dnsfilt-admin-backend'
        working-directory: dnsfilt-ui
        run: |
          npm ci
          npm run build
          mkdir -p ../dnsfilt-admin-backend/src/main/resources/static
          cp -r dist/dnsfilt-ui/browser/* ../dnsfilt-admin-backend/src/main/resources/static/
          cp dist/dnsfilt-ui/browser/home/index.html ../dnsfilt-admin-backend/src/main/resources/static/index.html

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login To Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'ikaushikpal' }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'ikaushikpal' }}/${{ matrix.image }}:${{ needs.version-and-tag.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME || 'ikaushikpal' }}/${{ matrix.image }}:v${{ needs.version-and-tag.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}