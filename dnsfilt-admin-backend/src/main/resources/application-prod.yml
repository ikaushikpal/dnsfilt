spring:
  datasource:
    # Oracle ATP JDBC URL: e.g. jdbc:oracle:thin:@dbname_high?TNS_ADMIN=/app/certs/wallet
    url: ${DB_URL:jdbc:oracle:thin:@dnsfiltatp_high?TNS_ADMIN=/app/certs/wallet}
    username: ${DB_USERNAME:ADMIN}
    password: ${DB_PASSWORD:your-oracle-password}
    driver-class-name: ${DB_DRIVER:oracle.jdbc.OracleDriver}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: false
