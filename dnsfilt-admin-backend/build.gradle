plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.dnsfilt'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    
    // Spring Cache & Caffeine in-memory L1 cache (Zero Redis load for web queries & JWT revocation)
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // Redis (Used strictly for DNS resolver blocklist push notifications)
    implementation 'redis.clients:jedis:5.2.0'

    // Oracle Database 23ai / 26ai Full Autonomous Production Suite (includes JDBC + Wallet Security PKI)
    implementation 'com.oracle.database.jdbc:ojdbc11-production:23.5.0.24.07'

    // Fallback SQL Drivers
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ==============================================================================
// AUTOMATED FRONTEND BUILD & BUNDLING TASKS (LOCAL DEVELOPMENT)
// ==============================================================================

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def npmCmd = isWindows ? 'npm.cmd' : 'npm'
def uiDir = file("${projectDir}/../dnsfilt-ui")

tasks.register('cleanStatic', Delete) {
    description = 'Deletes old frontend static files before packaging'
    onlyIf { uiDir.exists() }
    delete "${projectDir}/src/main/resources/static"
}

tasks.register('buildFrontend', Exec) {
    description = 'Builds Angular frontend (npm run build)'
    onlyIf { uiDir.exists() }
    dependsOn 'cleanStatic'
    workingDir uiDir
    commandLine npmCmd, 'run', 'build'
}

tasks.register('copyFrontend', Copy) {
    description = 'Copies Angular production build to Spring Boot static resources'
    onlyIf { uiDir.exists() }
    dependsOn 'buildFrontend'
    from "${projectDir}/../dnsfilt-ui/dist/dnsfilt-ui/browser"
    into "${projectDir}/src/main/resources/static"

    doLast {
        def staticDir = file("${projectDir}/src/main/resources/static")
        def csrFile = file("${staticDir}/index.csr.html")
        def indexFile = file("${staticDir}/index.html")
        if (csrFile.exists() && (!indexFile.exists() || indexFile.length() == 0)) {
            indexFile.text = csrFile.text
        } else if (file("${staticDir}/home/index.html").exists() && !indexFile.exists()) {
            indexFile.text = file("${staticDir}/home/index.html").text
        }
    }
}

// Automatically sync and rebuild frontend on local build when uiDir exists
if (uiDir.exists()) {
    processResources.dependsOn 'copyFrontend'
}
