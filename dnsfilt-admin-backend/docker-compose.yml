services:
  dnsfilt-admin-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dnsfilt-admin-backend
    ports:
      - "${ADMIN_PORT:-9090}:8080"
    env_file:
      - ${ENV_FILE:-.env}
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped
