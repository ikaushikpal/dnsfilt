services:
  dnsfilt-resolver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dnsfilt-resolver
    ports:
      - "${RESOLVER_PORT:-2053}:2053/udp"
      - "${RESOLVER_PORT:-2053}:2053/tcp"
    extra_hosts:
      - "kafka-server:host-gateway"
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    env_file:
      - ${ENV_FILE:-.env}
    deploy:
      resources:
        limits:
          memory: 200M
    restart: unless-stopped
