<nav class="w-full px-3 sm:px-6 py-2.5 font-sans">
  <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 sm:gap-4">
    
    <!-- LEFT: Logo (+ Hamburger if in Dashboard) -->
    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
      @if (hasAuthToken() && isDashboardTab()) {
        <button 
          (click)="toggleSidebar.emit()" 
          title="Toggle Sidebar"
          class="w-8 h-8 rounded-lg bg-stone-900 hover:bg-stone-800 border border-stone-800 hover:border-amber-500/50 text-stone-300 hover:text-amber-400 flex items-center justify-center transition active:scale-95 shadow-sm">
          <i class="fa-solid fa-bars text-sm"></i>
        </button>
      }

      <a (click)="selectTab('home')" class="flex items-center cursor-pointer select-none" title="DNSFilt Home">
        <img 
          src="/logo.png" 
          alt="DNSFilt" 
          class="h-7 sm:h-8 w-auto object-contain hover:opacity-90 transition">
      </a>
    </div>

    <!-- MIDDLE: -->
    <!-- On Dashboard: UTC time in the middle of navbar -->
    @if (isDashboardTab()) {
      <div class="flex items-center gap-1.5 text-stone-300 font-mono text-xs sm:text-sm bg-stone-900/90 border border-stone-800 px-3 py-1 rounded-xl shadow-inner select-all" title="Universal Coordinated Time (UTC)">
        <i class="fa-regular fa-clock text-amber-400 text-xs"></i>
        <span class="font-bold tracking-wide">{{ gmtTime() }}</span>
      </div>
    } @else {
      <!-- On Home / Public Pages: Guide, CLI, Learn -->
      <div class="flex items-center gap-1.5 sm:gap-2 font-mono text-xs overflow-x-auto py-1 scrollbar-none">
        <button 
          (click)="selectTab('guide')" 
          [class.bg-[rgb(230,130,16)]]="activeTab() === 'guide'"
          [class.text-stone-950]="activeTab() === 'guide'"
          [class.font-bold]="activeTab() === 'guide'"
          [class.text-stone-300]="activeTab() !== 'guide'"
          class="px-3 sm:px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5 shrink-0 hover:bg-stone-800 active:scale-95 text-xs">
          <i class="fa-solid fa-sliders text-xs"></i> <span>Guide</span>
        </button>

        <button 
          (click)="selectTab('toys')" 
          [class.bg-[rgb(230,130,16)]]="activeTab() === 'toys'"
          [class.text-stone-950]="activeTab() === 'toys'"
          [class.font-bold]="activeTab() === 'toys'"
          [class.text-stone-300]="activeTab() !== 'toys'"
          class="px-3 sm:px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5 shrink-0 hover:bg-stone-800 active:scale-95 text-xs">
          <i class="fa-solid fa-terminal text-xs"></i> <span>CLI</span>
        </button>

        <button 
          (click)="selectTab('learn')" 
          [class.bg-[rgb(230,130,16)]]="activeTab() === 'learn'"
          [class.text-stone-950]="activeTab() === 'learn'"
          [class.font-bold]="activeTab() === 'learn'"
          [class.text-stone-300]="activeTab() !== 'learn'"
          class="px-3 sm:px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5 shrink-0 hover:bg-stone-800 active:scale-95 text-xs">
          <i class="fa-solid fa-book text-xs"></i> <span>Learn</span>
        </button>
      </div>
    }

    <!-- RIGHT: -->
    <!-- On Dashboard: Logged in username only -->
    @if (isDashboardTab()) {
      <div class="flex items-center gap-2 font-mono text-xs shrink-0">
        <span class="text-amber-400 font-semibold bg-stone-900 border border-stone-800 px-3 py-1.5 rounded-xl flex items-center gap-1.5 text-xs">
          <i class="fa-solid fa-user-shield text-xs"></i>
          <span class="max-w-[120px] sm:max-w-[160px] truncate">{{ currentUser() || 'Operator' }}</span>
        </span>
      </div>
    } @else {
      <!-- On Home / Public Pages: SINGLE dynamic button for Dashboard OR Login based on token -->
      <div class="flex items-center gap-2 font-mono text-xs shrink-0">
        <button 
          (click)="onAuthAction()" 
          class="bg-[rgb(230,130,16)] hover:bg-[rgb(205,110,10)] text-stone-950 font-bold px-4 py-1.5 rounded-xl transition flex items-center gap-1.5 shadow-md active:scale-95 text-xs">
          <i [class]="authButtonIcon()"></i>
          <span>{{ authButtonLabel() }}</span>
        </button>
      </div>
    }

  </div>
</nav>
