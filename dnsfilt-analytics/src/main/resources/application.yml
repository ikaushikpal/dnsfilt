server:
  port: ${ANALYTICS_PORT:${PORT:8081}}

spring:
  application:
    name: dnsfilt-analytics
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:ADMIN}
    password: ${DB_PASSWORD:password}
    driver-class-name: ${DB_DRIVER:oracle.jdbc.OracleDriver}
  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.OracleDialect}
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    listener:
      missing-topics-fatal: false

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:host.docker.internal:9092}
  topic: ${KAFKA_TOPIC:dns.analytics.10min}
  security-protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
  sasl:
    mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
    username: ${KAFKA_SASL_USERNAME:}
    password: ${KAFKA_SASL_PASSWORD:}
  ssl:
    truststore-location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:certs/ca.pem}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_DIR:./logs}/dnsfilt-analytics.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_DIR:./logs}/dnsfilt-analytics-%d{yyyy-MM-dd}.log.gz
      max-history: ${LOG_RETENTION_DAYS:14}
      total-size-cap: 1GB
