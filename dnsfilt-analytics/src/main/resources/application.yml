server:
  port: ${ANALYTICS_PORT:${PORT:8081}}

spring:
  application:
    name: dnsfilt-analytics
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@(description=(retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=1522)(host=adb.ap-mumbai-1.oraclecloud.com))(connect_data=(service_name=g110819b1459332_oracledb1_high.adb.oraclecloud.com))(security=(ssl_server_dn_match=yes)))}
    username: ${DB_USERNAME:ADMIN}
    password: ${DB_PASSWORD:password}
    driver-class-name: ${DB_DRIVER:oracle.jdbc.OracleDriver}
  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.OracleDialect}
    hibernate:
      ddl-auto: update
    show-sql: false

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:host.docker.internal:9092}
  topic: ${KAFKA_TOPIC:dns.analytics.10min}
  security-protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
  sasl:
    mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
    username: ${KAFKA_SASL_USERNAME:}
    password: ${KAFKA_SASL_PASSWORD:}
  ssl:
    truststore-location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:certs/ca.pem}
